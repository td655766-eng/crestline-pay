<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crestline Pay | Support</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="index.html">
          <span class="brand-mark">CP</span>
          <span>Crestline Pay</span>
        </a>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="transfer.html">Transfer</a>
          <a href="support.html">Support</a>
          <a href="open-account.html">Open account</a>
          <a href="login.html">Login</a>
          <a href="admin-login.html">Admin</a>
        </nav>
      </header>

      <main>
        <section class="hero">
          <div class="hero-copy">
            <p class="eyebrow">Customer care</p>
            <h1>We’re here to help with account support and fraud protection.</h1>
            <p class="lead">Get help with card issues, security concerns, account changes, and transfer questions.</p>
          </div>
          <div class="form-card">
            <h3>Contact support</h3>
            <form data-support-form>
              <input type="text" placeholder="Full name" required />
              <input type="email" placeholder="Email address" required />
              <select>
                <option>Account help</option>
                <option>Card replacement</option>
                <option>Security concern</option>
              </select>
              <textarea rows="4" placeholder="Describe your issue"></textarea>
              <button type="submit">Send request</button>
            </form>
            <div data-status></div>
          </div>
        </section>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
