<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crestline Pay | Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="index.html">
          <span class="brand-mark">CP</span>
          <span>Crestline Pay</span>
        </a>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="admin-login.html">Admin</a>
        </nav>
      </header>

      <main class="auth-center">
        <section class="auth-card">
          <p class="eyebrow">Administrator access</p>
          <h1>Secure banking control center</h1>
          <p class="lead">Sign in to manage customer profiles, balances, and transaction history.</p>

          <form id="adminLoginForm" class="form-card">
            <input type="email" id="adminEmail" placeholder="Admin email" required />
            <input type="password" id="adminPassword" placeholder="Password" required />
            <button type="submit">Sign in</button>
          </form>

          <p class="helper-text">Demo credentials: admin@crestlinepay.com / Admin123!</p>
          <p id="adminError" class="error-text"></p>
        </section>
      </main>
    </div>

    <script>
      const form = document.getElementById('adminLoginForm');
      const errorBox = document.getElementById('adminError');

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const email = document.getElementById('adminEmail').value.trim();
        const password = document.getElementById('adminPassword').value;

        if (email === 'admin@crestlinepay.com' && password === 'Admin123!') {
          localStorage.setItem('crestlineAdminAuth', 'true');
          window.location.href = 'admin-dashboard.html';
        } else {
          errorBox.textContent = 'Invalid login credentials. Please try again.';
        }
      });
    </script>
  </body>
</html>
