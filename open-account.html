<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crestline Pay | Open Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="index.html">
          <span class="brand-mark">CP</span>
          <span>Crestline Pay</span>
        </a>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="transfer.html">Transfer</a>
          <a href="support.html">Support</a>
          <a href="open-account.html">Open account</a>
          <a href="login.html">Login</a>
        </nav>
      </header>

      <main>
        <section class="hero">
          <div class="hero-copy">
            <p class="eyebrow">New account</p>
            <h1>Open a premium banking account in minutes.</h1>
            <p class="lead">Start with secure onboarding, instant verification, and access to premium banking tools.</p>
          </div>
          <div class="form-card">
            <h3>Create your account</h3>
            <form data-account-form>
              <input type="text" placeholder="Full name" required />
              <input type="email" placeholder="Email address" required />
              <input type="password" placeholder="Password" required />
              <input type="password" placeholder="Confirm password" required />
              <input type="text" placeholder="Address" required />
              <select>
                <option>Checking account</option>
                <option>Savings account</option>
                <option>Business account</option>
              </select>
              <button type="submit">Create account</button>
            </form>
            <div data-status></div>
          </div>
        </section>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
