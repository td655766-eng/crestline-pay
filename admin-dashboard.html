<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crestline Pay | Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="index.html">
          <span class="brand-mark">CP</span>
          <span>Crestline Pay</span>
        </a>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="admin-dashboard.html">Admin panel</a>
          <a href="admin-login.html" onclick="localStorage.removeItem('crestlineAdminAuth')">Logout</a>
        </nav>
      </header>

      <main class="admin-grid">
        <section class="admin-card">
          <div class="card-row">
            <h3>Customer management</h3>
            <span class="pill">Live</span>
          </div>

          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Balance</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="customerTableBody"></tbody>
          </table>
        </section>

        <section class="admin-card">
          <div class="card-row">
            <h3>Create customer account</h3>
            <span class="pill">New</span>
          </div>
          <form id="createCustomerForm" class="form-card compact large-form">
            <input type="text" id="newCustomerName" placeholder="Customer name" required />
            <input type="email" id="newCustomerEmail" placeholder="Customer email" required />
            <input type="number" id="newCustomerBalance" placeholder="Initial balance" required />
            <select id="newCustomerStatus">
              <option value="Active">Active</option>
              <option value="Pending">Pending</option>
              <option value="Restricted">Restricted</option>
            </select>
            <button type="submit">Create account</button>
          </form>
          <p id="createAccountMessage" class="success-text"></p>
        </section>

        <section class="admin-card">
          <div class="card-row">
            <h3>Update account balance</h3>
            <span class="pill">Edit</span>
          </div>
          <form id="balanceForm" class="form-card compact">
            <select id="customerSelect"></select>
            <input type="number" id="newBalance" placeholder="New balance" required />
            <button type="submit">Save balance</button>
          </form>
          <p id="balanceMessage" class="success-text"></p>
        </section>

        <section class="admin-card wide">
          <div class="card-row">
            <h3>Transaction history</h3>
            <span class="pill">Recent</span>
          </div>
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Customer</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="transactionTableBody"></tbody>
          </table>
        </section>
      </main>
    </div>

    <script>
      if (!localStorage.getItem('crestlineAdminAuth')) {
        window.location.href = 'admin-login.html';
      }

      const STORAGE_KEY = 'crestlineCustomers';
      const createForm = document.getElementById('createCustomerForm');
      const balanceForm = document.getElementById('balanceForm');
      const customerTableBody = document.getElementById('customerTableBody');
      const transactionTableBody = document.getElementById('transactionTableBody');
      const customerSelect = document.getElementById('customerSelect');
      const createMessage = document.getElementById('createAccountMessage');
      const balanceMessage = document.getElementById('balanceMessage');

      function formatCurrency(amount) {
        return `$${Number(amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      }

      function getCustomers() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            return JSON.parse(saved);
          } catch (error) {
            return [];
          }
        }

        return [
          {
            id: 1,
            name: 'Alex Morgan',
            email: 'alex@example.com',
            balance: 200000,
            status: 'Active',
            transactions: [
              { date: '2026-07-25', type: 'Deposit', amount: 8400, status: 'Completed' },
              { date: '2026-07-24', type: 'Transfer', amount: -1200, status: 'Completed' }
            ]
          },
          {
            id: 2,
            name: 'Grace Thompson',
            email: 'grace@example.com',
            balance: 48500,
            status: 'Active',
            transactions: [
              { date: '2026-07-24', type: 'Transfer', amount: -1200, status: 'Completed' }
            ]
          }
        ];
      }

      function saveCustomers(customers) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(customers));
      }

      function render() {
        const customers = getCustomers();
        customerTableBody.innerHTML = customers.map((customer) => `
          <tr>
            <td>${customer.name}</td>
            <td>${customer.email}</td>
            <td>${formatCurrency(customer.balance)}</td>
            <td>${customer.status}</td>
          </tr>
        `).join('');

        customerSelect.innerHTML = customers.map((customer) => `
          <option value="${customer.id}">${customer.name}</option>
        `).join('');

        const allTransactions = customers.flatMap((customer) =>
          customer.transactions.map((transaction) => ({
            ...transaction,
            customerName: customer.name
          }))
        );

        transactionTableBody.innerHTML = allTransactions.slice().reverse().map((transaction) => `
          <tr>
            <td>${transaction.date}</td>
            <td>${transaction.customerName}</td>
            <td>${transaction.type}</td>
            <td>${transaction.amount >= 0 ? '+' : '-'}${formatCurrency(Math.abs(transaction.amount))}</td>
            <td>${transaction.status}</td>
          </tr>
        `).join('');
      }

      createForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const customers = getCustomers();
        const newCustomer = {
          id: Date.now(),
          name: document.getElementById('newCustomerName').value.trim(),
          email: document.getElementById('newCustomerEmail').value.trim(),
          balance: Number(document.getElementById('newCustomerBalance').value),
          status: document.getElementById('newCustomerStatus').value,
          transactions: [
            {
              date: new Date().toISOString().slice(0, 10),
              type: 'Opening Deposit',
              amount: Number(document.getElementById('newCustomerBalance').value),
              status: 'Completed'
            }
          ]
        };

        customers.push(newCustomer);
        saveCustomers(customers);
        createForm.reset();
        createMessage.textContent = `${newCustomer.name}'s account has been created.`;
        render();
      });

      balanceForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const customers = getCustomers();
        const customerId = Number(customerSelect.value);
        const customer = customers.find((entry) => entry.id === customerId);
        const newBalance = Number(document.getElementById('newBalance').value);

        if (customer) {
          customer.balance = newBalance;
          customer.transactions.push({
            date: new Date().toISOString().slice(0, 10),
            type: 'Balance Update',
            amount: newBalance,
            status: 'Completed'
          });
          saveCustomers(customers);
          balanceMessage.textContent = `${customer.name}'s balance updated to ${formatCurrency(newBalance)}.`;
          render();
        }
      });

      render();
    </script>
  </body>
</html>
