<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crestline Pay | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="index.html">
          <span class="brand-mark">CP</span>
          <span>Crestline Pay</span>
        </a>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="transfer.html">Transfer</a>
          <a href="support.html">Support</a>
          <a href="open-account.html">Open account</a>
          <a href="login.html">Login</a>
          <a href="admin-login.html">Admin</a>
        </nav>
      </header>

      <main>
        <section class="hero">
          <div class="hero-copy">
            <p class="eyebrow">Secure sign in</p>
            <h1>Access your account with confidence and speed.</h1>
            <p class="lead">Sign in to review balances, send transfers, and contact support.</p>
          </div>
          <div class="form-card">
            <h3>Log in to Crestline Pay</h3>
            <form data-login-form>
              <input type="email" placeholder="Email address" required />
              <input type="password" placeholder="Password" required />
              <button type="submit">Sign in</button>
            </form>
            <p>New here? <a href="open-account.html">Open a new account</a>.</p>
          </div>
        </section>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
